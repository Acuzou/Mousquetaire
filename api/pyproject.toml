[project]
name = "mousquetaire-api"
version = "0.1.0"
description = "Backend FastAPI for Mousquetaire."
requires-python = ">=3.10"
dependencies = [
  "fastapi[standard]>=0.136.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
